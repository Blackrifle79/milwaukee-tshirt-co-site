<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin Login</title>

    <!-- Correct relative paths -->
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

<div class="admin-login-container">
    <div class="admin-login-box">

        <img src="../assets/logos/MTC.svg" alt="Milwaukee T-Shirt Co." class="admin-logo">

        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">

        <button onclick="login()">Log In</button>

        <div id="login-status"></div>

    </div>
</div>

<!-- Correct script paths -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script src="js/supabase.js" defer></script>
<script src="js/auth.js" defer></script>

</body>
</html>

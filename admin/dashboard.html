<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
        }

        #tickets ul {
            list-style: none;
            padding-left: 0;
        }

        #tickets li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }

        a.ticket-link {
            color: white;
            text-decoration: none;
        }

        a.ticket-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1 style="color:white;">Dashboard</h1>

<h2 style="color:white;">Tickets</h2>
<div id="tickets" style="color:white; padding:20px;"></div>

<h2 style="color:white;">Recent Quotes</h2>
<div id="quotes" style="color:white; padding:20px;"></div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

<!-- Global config + auth -->
<script defer src="/admin/js/supabase.js"></script>
<script defer src="/admin/js/auth.js"></script>

<!-- Inline Dashboard Logic -->
<script>
async function loadDashboard() {
    // Wait until Supabase client is ready
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const bucket = "quotes_bucket";

    const { data, error } = await window.client
        .storage
        .from(bucket)
        .list("", {
            limit: 1000,
            sortBy: { column: "name", order: "asc" }
        });

    const ticketDiv = document.getElementById("tickets");

    if (error) {
        console.error("Storage error:", error);
        ticketDiv.innerHTML = "<p>Error loading ticket folders.</p>";
        return;
    }

    // Filter ONLY directories
    const folders = data.filter(item =>
        item.type === "dir" ||
        item.type === "folder" ||
        item.type === "directory"
    );

    if (folders.length === 0) {
        ticketDiv.innerHTML = "<p>No tickets found.</p>";
        return;
    }

    let html = "<ul>";
    folders.forEach(f => {
        html += `
            <li>
                <a class="ticket-link" href="/admin/ticket.html?folder=${encodeURIComponent(f.name)}">
                    ${f.name}
                </a>
            </li>
        `;
    });
    html += "</ul>";

    ticketDiv.innerHTML = html;
}

document.addEventListener("DOMContentLoaded", loadDashboard);
</script>

</body>
</html>

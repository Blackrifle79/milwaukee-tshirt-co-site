<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/styles.css">

    <style>
        /* Dashboard-specific layout */
        .dashboard-container {
            max-width: 1000px;
            margin: 60px auto;
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .dashboard-card {
            background: var(--white-overlay);
            border: 1px solid rgba(255,255,255,0.15);
            padding: 25px;
            backdrop-filter: blur(6px);
            color: white;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .dashboard-card:hover {
            background: rgba(255,255,255,0.18);
        }

        /* Ticket list */
        .ticket-card {
            background: rgba(0,0,0,0.55);
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .ticket-card h2 {
            margin-bottom: 15px;
            color: var(--off-white);
            border-bottom: 1px solid rgba(255,255,255,0.15);
            padding-bottom: 6px;
        }

        #ticketList a {
            display: block;
            padding: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.15);
            text-decoration: none;
            color: white;
        }

        #ticketList a:hover {
            background: rgba(255,255,255,0.2);
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <!-- Dashboard tiles -->
    <div class="dashboard-grid">

        <!-- FIXED: tile now loads tickets -->
        <div class="dashboard-card" onclick="loadTickets()">
            <h3>Tickets</h3>
            <p>View and manage all submitted quotes.</p>
        </div>

        <div class="dashboard-card">
            <h3>Garments</h3>
            <p>Coming soon.</p>
        </div>

        <div class="dashboard-card">
            <h3>Pricing</h3>
            <p>Coming soon.</p>
        </div>

        <div class="dashboard-card">
            <h3>PO Manager</h3>
            <p>Coming soon.</p>
        </div>

    </div>

    <!-- TICKET LIST -->
    <div class="ticket-card" style="margin-top:40px;">
        <h2>Tickets</h2>
        <div id="ticketList">Loading tickets…</div>
    </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Config + Auth Guard -->
<script src="/admin/js/supabase.js"></script>
<script src="/admin/js/auth.js"></script>

<!-- =============================== -->
<!-- INLINE TICKET LOADER (replacing dashboard.js) -->
<!-- =============================== -->
<script>
async function loadTickets() {

    // Wait until Supabase client is available
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const ticketBox = document.getElementById("ticketList");
    ticketBox.innerHTML = "Loading…";

    const { data, error } = await window.client
        .storage
        .from("quotes_bucket")
        .list("", { limit: 1000 });

    if (error) {
        console.error(error);
        ticketBox.innerHTML = "Error loading tickets.";
        return;
    }

    const folders = data.filter(item => item.type === "folder" || item.type === "dir");

    if (folders.length === 0) {
        ticketBox.innerHTML = "No tickets found.";
        return;
    }

    let html = "";
    folders.forEach(f => {
        html += `
            <a href="/admin/ticket.html?folder=${encodeURIComponent(f.name)}">
                ${f.name}
            </a>
        `;
    });

    ticketBox.innerHTML = html;
}

// Load tickets automatically on page load
document.addEventListener("DOMContentLoaded", loadTickets);
</script>

</body>
</html>

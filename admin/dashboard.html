<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Admin Dashboard</title>

    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: white;
        }

        .dashboard-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .dashboard-card {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 24px;
            text-align: center;
            backdrop-filter: blur(6px);
            cursor: pointer;
            transition: 0.2s ease;
        }

        .dashboard-card:hover {
            background: rgba(255,255,255,0.16);
            border-color: rgba(255,255,255,0.25);
        }
    </style>
</head>

<body>

<div class="dashboard-container">

    <h1>Dashboard</h1>

    <div class="dashboard-grid">

        <!-- NOW GOES TO tickets.html -->
        <div class="dashboard-card" onclick="window.location.href='/admin/tickets.html'">
            <h3>Tickets</h3>
            <p>View and manage customer quotes.</p>
        </div>

        <div class="dashboard-card">
            <h3>Garments</h3>
            <p>Coming soon</p>
        </div>

        <div class="dashboard-card">
            <h3>Pricing</h3>
            <p>Coming soon</p>
        </div>

        <div class="dashboard-card">
            <h3>PO Manager</h3>
            <p>Coming soon</p>
        </div>

    </div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script defer src="/admin/js/supabase.js"></script>
<script defer src="/admin/js/auth.js"></script>

</body>
</html>

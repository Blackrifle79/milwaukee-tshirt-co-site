<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ticket</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: white;
            padding: 20px;
        }

        .section {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .field-row {
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .field-label {
            font-weight: bold;
            color: #8fe3ff;
        }

        .file-link {
            color: #ffd27f;
            text-decoration: none;
        }
        .file-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1>Ticket Details</h1>

<div id="quoteData" class="section"></div>

<h2>Uploaded Files</h2>
<div id="fileList" class="section"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

<!-- Project Supabase client -->
<script defer src="/admin/js/supabase.js"></script>

<script>
async function loadTicket() {

    // Wait for Supabase client to initialize
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const params = new URLSearchParams(window.location.search);
    let folder = params.get("folder");

    const quoteBox = document.getElementById("quoteData");
    const fileBox  = document.getElementById("fileList");

    if (!folder) {
        quoteBox.innerHTML = "Missing folder parameter.";
        return;
    }

    // Remove any trailing slashes Netlify may append
    folder = folder.replace(/\/+$/, "");

    // Extract numeric quote number
    const quoteNumber = Number(folder.split("_")[0]);

    if (!quoteNumber || isNaN(quoteNumber)) {
        quoteBox.innerHTML = "Invalid folder format.";
        return;
    }

    // ---------------------------
    // 1️⃣ Load quote row
    // ---------------------------
    const { data: quote, error: qErr } = await window.client
        .from("quotes")
        .select("*")
        .eq("quote_number", quoteNumber)
        .maybeSingle();

    if (qErr) {
        console.error("Quote DB Error:", qErr);
        quoteBox.innerHTML = "Error loading quote data.";
        return;
    }

    if (!quote) {
        quoteBox.innerHTML = "No quote found.";
        return;
    }

    // Render all fields dynamically
    let fieldsHTML = "";
    Object.entries(quote).forEach(([key, value]) => {
        fieldsHTML += `
            <div class="field-row">
                <span class="field-label">${key}:</span> ${value ?? ""}
            </div>
        `;
    });

    quoteBox.innerHTML = fieldsHTML;

    // ---------------------------
    // 2️⃣ Load uploaded files
    // ---------------------------
    const { data: files, error: fErr } = await window.client
        .storage
        .from("quotes_bucket")
        .list(folder, { limit: 100 });

    if (fErr) {
        console.error("File Load Error:", fErr);
        fileBox.innerHTML = "Error loading files.";
        return;
    }

    if (!files || files.length === 0) {
        fileBox.innerHTML = "No uploaded files.";
        return;
    }

    let fileHTML = "";
    files.forEach(file => {
        const url = window.client.storage
            .from("quotes_bucket")
            .getPublicUrl(`${folder}/${file.name}`).data.publicUrl;

        fileHTML += `
            <div class="field-row">
                <a class="file-link" href="${url}" target="_blank">${file.name}</a>
            </div>
        `;
    });

    fileBox.innerHTML = fileHTML;
}

// Start logic
document.addEventListener("DOMContentLoaded", loadTicket);
</script>

</body>
</html>

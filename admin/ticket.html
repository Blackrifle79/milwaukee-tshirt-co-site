<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ticket</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: white;
            padding: 20px;
        }

        .section {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .field-row {
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 6px;
        }

        .field-label {
            font-weight: bold;
            color: #8fe3ff;
        }

        .file-link {
            color: #ffd27f;
            text-decoration: none;
        }
        .file-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1>Ticket Details</h1>

<div id="quoteData" class="section"></div>

<h2>Uploaded Files</h2>
<div id="fileList" class="section"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>

<!-- Config -->
<script defer src="/admin/js/supabase.js"></script>

<script>
async function loadTicket() {
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    const quoteBox = document.getElementById("quoteData");
    const fileBox = document.getElementById("fileList");

    if (!folder) {
        quoteBox.innerHTML = "Missing folder parameter.";
        return;
    }

    // Extract quote number from "18503_dan-zarwell"
    const quoteNumber = parseInt(folder.split("_")[0]);

    if (isNaN(quoteNumber)) {
        quoteBox.innerHTML = "Invalid ticket folder format.";
        return;
    }

    // Fetch quote row
    const { data: quote, error: qErr } = await window.client
        .from("quotes")
        .select("*")
        .eq("quote_number", quoteNumber)
        .maybeSingle();

    if (qErr) {
        console.error("DB Error:", qErr);
        quoteBox.innerHTML = "Database error loading quote.";
        return;
    }

    if (!quote) {
        quoteBox.innerHTML = "Quote data not found in database.";
        return;
    }

    // Auto-build rows
    let html = "";
    Object.entries(quote).forEach(([key, value]) => {
        html += `
            <div class="field-row">
                <span class="field-label">${key}:</span> ${value ?? ""}
            </div>
        `;
    });

    quoteBox.innerHTML = html;

    // List uploaded files
    const { data: files, error: fErr } = await window.client
        .storage
        .from("quotes_bucket")
        .list(folder, { limit: 100 });

    if (fErr) {
        console.error("File Error:", fErr);
        fileBox.innerHTML = "Error loading files.";
        return;
    }

    if (!files || files.length === 0) {
        fileBox.innerHTML = "No uploaded files found.";
        return;
    }

    let fileHTML = "";
    files.forEach(file => {
        const publicUrl = window.client.storage
            .from("quotes_bucket")
            .getPublicUrl(`${folder}/${file.name}`).data.publicUrl;

        fileHTML += `
            <div class="field-row">
                <a class="file-link" href="${publicUrl}" target="_blank">${file.name}</a>
            </div>
        `;
    });

    fileBox.innerHTML = fileHTML;
}

document.addEventListener("DOMContentLoaded", loadTicket);
</script>

</body>
</html>

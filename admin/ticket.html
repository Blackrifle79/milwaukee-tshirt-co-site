<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ticket</title>

    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin/admin.css">

    <style>
        /* Page wrapper */
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: var(--admin-text);
            padding: 30px;
            padding-bottom: 120px;
        }

        .page-container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* Title */
        h1 {
            margin-bottom: 25px;
            font-size: 28px;
            font-weight: 600;
            color: var(--white);
        }

        /* TICKET VIEW CARDS */
        .ticket-details-card {
            padding: 22px;
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            border-radius: 0px;
            margin-bottom: 28px;
            backdrop-filter: blur(6px);
        }

        .ticket-details-card h2 {
            color: var(--admin-heading);
            margin-bottom: 15px;
            font-size: 20px;
            font-weight: 600;
        }

        .field-row {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }

        .field-label {
            color: var(--admin-heading);
            font-weight: bold;
        }

        /* File List */
        .file-row {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .file-link {
            color: #ffd27f;
            text-decoration: none;
            font-size: 15px;
        }

        .file-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            background: var(--danger);
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 0;
            color: white;
        }

        .delete-btn:hover {
            background: var(--danger-hover);
        }

        /* FLOATING BUTTONS */
        .ticket-float-buttons {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            flex-direction: row;
            gap: 12px;
            z-index: 1000;
        }

        .ticket-float-buttons a {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            padding: 12px 22px;
            text-decoration: none;
            color: var(--admin-text);
            font-size: 15px;
            border-radius: 0;
            transition: 0.2s;
            backdrop-filter: blur(6px);
        }

        .ticket-float-buttons a:hover {
            background: rgba(255,255,255,0.14);
            border-color: rgba(255,255,255,0.22);
        }
    </style>
</head>

<body>
<div class="page-container">

    <h1>Ticket Details</h1>

    <div id="formData" class="ticket-details-card"></div>

    <div class="ticket-details-card">
        <h2>Uploaded Files</h2>
        <div id="fileList"></div>
    </div>

</div>

<input type="file" id="filePicker" style="display:none;" />

<!-- FLOATING BUTTONS -->
<div class="ticket-float-buttons">
    <a href="#" id="createQuoteBtn">Create Quote</a>
    <a href="#" id="uploadBtn">Upload File</a>
</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script defer src="/admin/js/supabase.js"></script>

<script>
/* ---------------------------------------------
   LOAD TICKET DATA
--------------------------------------------- */
async function loadTicket() {
    while (!window.client) await new Promise(r => setTimeout(r, 10));

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    const formBox = document.getElementById("formData");
    const fileBox = document.getElementById("fileList");

    if (!folder) {
        formBox.innerHTML = "<p>Missing folder parameter.</p>";
        return;
    }

    // Load form.json
    const { data: jsonFile } = await window.client.storage
        .from("quotes_bucket")
        .download(`${folder}/form.json`);

    if (!jsonFile) {
        formBox.innerHTML = "<p>No form.json found.</p>";
    } else {
        const formData = JSON.parse(await jsonFile.text());

        let html = "<h2>Form Submission</h2>";
        for (const [key, value] of Object.entries(formData)) {
            html += `
                <div class="field-row">
                    <span class="field-label">${key}:</span> ${value}
                </div>`;
        }
        formBox.innerHTML = html;
    }

    // Load uploaded files
    const { data: files } = await window.client.storage
        .from("quotes_bucket")
        .list(folder);

    if (!files || files.length === 0) {
        fileBox.innerHTML = "<p>No uploaded files.</p>";
        return;
    }

    let fileHTML = "";
    for (const file of files) {
        if (file.name === "form.json") continue;

        const { data: signed } = await window.client.storage
            .from("quotes_bucket")
            .createSignedUrl(`${folder}/${file.name}`, 3600);

        fileHTML += `
            <div class="file-row">
                <a class="file-link" href="${signed.signedUrl}" target="_blank">${file.name}</a>
                <button class="delete-btn" data-filename="${file.name}">Delete</button>
            </div>`;
    }

    fileBox.innerHTML = fileHTML;
}

/* ---------------------------------------------
   UPLOAD FILE
--------------------------------------------- */
document.getElementById("uploadBtn").addEventListener("click", () => {
    document.getElementById("filePicker").click();
});

document.getElementById("filePicker").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    await window.client.storage
        .from("quotes_bucket")
        .upload(`${folder}/${file.name}`, file, { upsert: true });

    loadTicket();
});

/* ---------------------------------------------
   DELETE FILE
--------------------------------------------- */
document.addEventListener("click", async (e) => {
    if (!e.target.classList.contains("delete-btn")) return;

    const filename = e.target.dataset.filename;
    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    await window.client.storage
        .from("quotes_bucket")
        .remove([`${folder}/${filename}`]);

    loadTicket();
});

/* ---------------------------------------------
   CREATE QUOTE REDIRECT
--------------------------------------------- */
document.getElementById("createQuoteBtn").addEventListener("click", () => {
    const folder = new URLSearchParams(window.location.search).get("folder");
    window.location.href = `/admin/create_quote.html?folder=${folder}`;
});

document.addEventListener("DOMContentLoaded", loadTicket);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ticket</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: white;
            padding: 30px;
            padding-bottom: 110px; /* Room for bottom bar */
            font-family: sans-serif;
        }

        .page-container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 25px;
            font-size: 32px;
            color: #ffffff;
            border-bottom: 2px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }

        .card {
            background: rgba(255,255,255,0.06);
            padding: 22px;
            border-radius: 8px;
            margin-bottom: 28px;
            box-shadow: 0 0 12px rgba(0,0,0,0.25);
        }

        .card h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 22px;
            color: #8fe3ff;
        }

        .field-row {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .field-label {
            font-weight: bold;
            color: #8fe3ff;
        }

        .file-link {
            color: #ffd27f;
            text-decoration: none;
            font-size: 15px;
        }
        .file-link:hover {
            text-decoration: underline;
        }

        .delete-btn {
            background: #BA3B46;
            color: white;
            border: none;
            padding: 6px 12px;
            font-size: 14px;
            cursor: pointer;
            border-radius: 4px;
        }
        .delete-btn:hover {
            background: #d44752;
        }

        /* Sticky action bar */
        .ticket-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.65);
            backdrop-filter: blur(6px);
            border-top: 1px solid rgba(255,255,255,0.15);
            padding: 14px 20px;
            display: flex;
            gap: 16px;
            justify-content: center;
            z-index: 9999;
        }

        .ticket-action-bar button {
            background: rgba(255,255,255,0.85);
            color: var(--dark);
            border: 1px solid var(--light-grey);
            padding: 12px 22px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 4px;
            cursor: pointer;
        }
        .ticket-action-bar button:hover {
            background: white;
        }
    </style>
</head>

<body>
<div class="page-container">

    <h1>Ticket Details</h1>

    <div id="formData" class="card"></div>

    <div class="card">
        <h2>Uploaded Files</h2>
        <div id="fileList"></div>
    </div>

</div>

<!-- Hidden file picker -->
<input type="file" id="filePicker" style="display:none;" />

<!-- Bottom Action Bar -->
<div class="ticket-action-bar">
    <button>Create Quote</button>
    <button>Request Payment</button>
    <button id="uploadBtn">Upload File</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script defer src="/admin/js/supabase.js"></script>

<script>
/* ---------------------------------------------------------
   LOAD TICKET INFO
--------------------------------------------------------- */
async function loadTicket() {
    while (!window.client) await new Promise(r => setTimeout(r, 10));

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    const formBox = document.getElementById("formData");
    const fileBox = document.getElementById("fileList");

    if (!folder) {
        formBox.innerHTML = "<p>Missing folder parameter.</p>";
        return;
    }

    // Load form.json
    const { data: jsonFile, error: jsonErr } = await window.client.storage
        .from("quotes_bucket")
        .download(`${folder}/form.json`);

    if (jsonErr) {
        formBox.innerHTML = "<p>No form.json found.</p>";
    } else {
        const text = await jsonFile.text();
        const formData = JSON.parse(text);

        let html = `<h2>Form Submission</h2>`;
        for (const [key, value] of Object.entries(formData)) {
            html += `
                <div class="field-row">
                    <div><span class="field-label">${key}:</span> ${value}</div>
                </div>
            `;
        }
        formBox.innerHTML = '<div class="card">' + html + '</div>';
    }

    // Load uploaded files
    const { data: files, error: fErr } = await window.client.storage
        .from("quotes_bucket")
        .list(folder);

    if (fErr) {
        fileBox.innerHTML = "<p>Error loading files.</p>";
        return;
    }

    if (!files || files.length === 0) {
        fileBox.innerHTML = "<p>No uploaded files.</p>";
        return;
    }

    let fileHTML = "";
    for (const file of files) {
        if (file.name === "form.json" || file.name === ".keep") continue;

        const { data: signed } = await window.client.storage
            .from("quotes_bucket")
            .createSignedUrl(`${folder}/${file.name}`, 3600);

        fileHTML += `
            <div class="field-row">
                <a class="file-link" href="${signed.signedUrl}" target="_blank">${file.name}</a>
                <button class="delete-btn" data-filename="${file.name}">Delete</button>
            </div>
        `;
    }

    fileBox.innerHTML = fileHTML;
}

/* ---------------------------------------------------------
   UPLOAD FILE
--------------------------------------------------------- */
document.getElementById("uploadBtn").addEventListener("click", () => {
    document.getElementById("filePicker").click();
});

document.getElementById("filePicker").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    while (!window.client) await new Promise(r => setTimeout(r, 10));

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");
    const path = `${folder}/${file.name}`;

    const { error } = await window.client.storage
        .from("quotes_bucket")
        .upload(path, file, { upsert: true });

    if (error) {
        alert("Upload failed.");
        return;
    }

    await loadTicket();
});

/* ---------------------------------------------------------
   DELETE FILE
--------------------------------------------------------- */
document.addEventListener("click", async (event) => {
    if (!event.target.classList.contains("delete-btn")) return;

    const filename = event.target.dataset.filename;
    if (!confirm(`Delete "${filename}"?`)) return;

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");
    const fullPath = `${folder}/${filename}`;

    while (!window.client) await new Promise(r => setTimeout(r, 10));

    const { error } = await window.client.storage
        .from("quotes_bucket")
        .remove([fullPath]);

    if (error) {
        alert("Delete failed.");
        return;
    }

    await loadTicket();
});

document.addEventListener("DOMContentLoaded", loadTicket);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Ticket</title>
    <link rel="stylesheet" href="/styles.css">

    <style>
        body {
            background: var(--dark) url('/assets/background.png') repeat !important;
            color: white;
            padding: 20px;
            padding-bottom: 90px; /* Prevents content hiding behind action bar */
        }

        .section {
            background: rgba(255,255,255,0.05);
            padding: 20px;
            border-radius: 6px;
            margin-bottom: 25px;
        }

        .field-row {
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .field-label {
            font-weight: bold;
            color: #8fe3ff;
        }

        .file-link {
            color: #ffd27f;
            text-decoration: none;
        }
        .file-link:hover {
            text-decoration: underline;
        }

        /* ----------------------------- */
        /*  STICKY ACTION BAR            */
        /* ----------------------------- */
        .ticket-action-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(6px);
            border-top: 1px solid rgba(255,255,255,0.18);
            padding: 12px 18px;
            display: flex;
            gap: 12px;
            justify-content: center;
            z-index: 9999;
        }

        .ticket-action-bar button {
            background: rgba(255,255,255,0.85);
            color: var(--dark);
            border: 1px solid var(--light-grey);
            padding: 12px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 0;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .ticket-action-bar button:hover {
            background: white;
            border-color: white;
        }
    </style>
</head>

<body>

<h1>Ticket Details</h1>

<div id="formData" class="section"></div>

<h2>Uploaded Files</h2>
<div id="fileList" class="section"></div>

<!-- Hidden file picker for uploads -->
<input type="file" id="filePicker" style="display:none;" />

<!-- ============================ -->
<!-- STICKY BOTTOM ACTION BAR     -->
<!-- ============================ -->
<div class="ticket-action-bar">
    <button>Create Quote</button>
    <button>Request Payment</button>
    <button id="uploadBtn">Upload File</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.js"></script>
<script defer src="/admin/js/supabase.js"></script>

<script>
async function loadTicket() {
    // Wait for supabase client
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    const formBox = document.getElementById("formData");
    const fileBox = document.getElementById("fileList");

    if (!folder) {
        formBox.innerHTML = "Missing folder parameter.";
        return;
    }

    // Load form.json
    const { data: jsonFile, error: jsonErr } = await window.client.storage
        .from("quotes_bucket")
        .download(`${folder}/form.json`);

    if (jsonErr) {
        console.error("form.json missing:", jsonErr);
        formBox.innerHTML = "<p>No form.json found.</p>";
    } else {
        const text = await jsonFile.text();
        const formData = JSON.parse(text);

        let html = "<h2>Form Submission</h2>";

        for (const [key, value] of Object.entries(formData)) {
            html += `
                <div class="field-row">
                    <span class="field-label">${key}:</span> ${value}
                </div>
            `;
        }

        formBox.innerHTML = html;
    }

    // Load uploaded files
    const { data: files, error: fErr } = await window.client.storage
        .from("quotes_bucket")
        .list(folder);

    if (fErr) {
        console.error(fErr);
        fileBox.innerHTML = "Error loading files.";
        return;
    }

    if (!files || files.length === 0) {
        fileBox.innerHTML = "No uploaded files.";
        return;
    }

    let fileHTML = "";
    for (const file of files) {
        if (file.name === "form.json" || file.name === ".keep") continue;

        const { data: signed, error: signedErr } = await window.client.storage
            .from("quotes_bucket")
            .createSignedUrl(`${folder}/${file.name}`, 3600);

        if (signedErr) {
            console.error("Signed URL error:", signedErr);
            continue;
        }

        fileHTML += `
            <div class="field-row">
                <a class="file-link" href="${signed.signedUrl}" target="_blank">${file.name}</a>
            </div>
        `;
    }

    fileBox.innerHTML = fileHTML;
}

// ------------------------------------------
// FILE UPLOAD LOGIC
// ------------------------------------------
document.getElementById("uploadBtn").addEventListener("click", () => {
    document.getElementById("filePicker").click();
});

document.getElementById("filePicker").addEventListener("change", async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const params = new URLSearchParams(window.location.search);
    const folder = params.get("folder");

    // Wait for Supabase
    while (!window.client) {
        await new Promise(r => setTimeout(r, 10));
    }

    const path = `${folder}/${file.name}`;

    // Upload file
    const { data, error } = await window.client.storage
        .from("quotes_bucket")
        .upload(path, file, { upsert: true });

if (error) {
    alert("Upload failed: " + JSON.stringify(error, null, 2));
    console.error("UPLOAD ERROR:", error);
    return;
}


    // Refresh file list
    await loadTicket();
    alert("File uploaded.");
});

document.addEventListener("DOMContentLoaded", loadTicket);
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Tickets</title>

    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/admin/admin.css">

    <style>
        /* Page Layout */
        .tickets-container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        /* Grid */
        .ticket-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        /* Ticket Tile (inherits admin.css card look) */
        .ticket-tile {
            background: var(--admin-card-bg);
            border: 1px solid var(--admin-border);
            padding: 22px;
            text-align: center;
            backdrop-filter: blur(6px);
            color: var(--admin-text);
            cursor: pointer;
            position: relative;
            transition: 0.2s ease;
        }

        .ticket-tile:hover {
            background: var(--admin-card-bg-hover);
            border-color: var(--admin-border-hover);
        }

        /* Improved delete button (matches design system) */
        .delete-ticket-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 28px;
            height: 28px;
            background: rgba(0,0,0,0.55);
            border: 1px solid rgba(255,255,255,0.18);
            color: #8fe3ff;
            font-size: 18px;
            font-weight: bold;
            line-height: 26px;
            text-align: center;
            cursor: pointer;
            border-radius: 3px;
            transition: 0.2s ease;
            z-index: 5;
        }

        .delete-ticket-btn:hover {
            background: rgba(0,0,0,0.85);
            border-color: rgba(255,255,255,0.32);
            color: white;
        }

        .loading-message {
            margin-top: 20px;
            font-size: 16px;
            opacity: 0.85;
            text-align: center;
        }

    </style>
</head>

<body>

<!-- Floating Buttons -->
<div class="admin-float-buttons">
    <a href="/admin/dashboard.html">Dashboard</a>
    <a href="/admin/login.html" onclick="logout()">Logout</a>
</div>

<div class="tickets-container">

    <div id="ticketGrid" class="ticket-grid"></div>
    <div id="loading" class="loading-message">Loading tickets…</div>

</div>

<!-- Supabase -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script defer src="/admin/js/supabase.js"></script>
<script defer src="/admin/js/auth.js"></script>

<script>
function logout() {
    localStorage.removeItem("supabase.auth.token");
}

/* DELETE A TICKET */
async function deleteTicket(folderName, tileElement) {
    if (!confirm(`Delete ticket "${folderName}"?\n\nThis cannot be undone.`)) return;

    // List all items in folder
    const { data: objects } = await window.client
        .storage
        .from("quotes_bucket")
        .list(folderName, { limit: 1000 });

    const paths = objects.map(o => `${folderName}/${o.name}`);

    if (paths.length > 0) {
        await window.client.storage.from("quotes_bucket").remove(paths);
    }

    // Remove the folder itself
    await window.client.storage.from("quotes_bucket").remove([folderName]);

    // Remove tile from UI
    tileElement.remove();
}

/* LOAD TICKETS */
async function loadTickets() {
    while (!window.client) await new Promise(r => setTimeout(r, 20));

    const grid = document.getElementById("ticketGrid");
    const loading = document.getElementById("loading");

    const { data } = await window.client
        .storage
        .from("quotes_bucket")
        .list("", { limit: 1000 });

    const folders = data.filter(item => item.id === null);

    if (folders.length === 0) {
        loading.innerText = "No tickets found.";
        return;
    }

    loading.style.display = "none";

    folders.forEach(folder => {
        const tile = document.createElement("div");
        tile.className = "ticket-tile";

        tile.innerHTML = `
            <div class="delete-ticket-btn">×</div>
            ${folder.name}
        `;

        tile.onclick = (e) => {
            if (e.target.classList.contains("delete-ticket-btn")) return;
            window.location.href = "/admin/ticket.html?folder=" + encodeURIComponent(folder.name);
        };

        tile.querySelector(".delete-ticket-btn").onclick = (e) => {
            e.stopPropagation();
            deleteTicket(folder.name, tile);
        };

        grid.appendChild(tile);
    });
}

document.addEventListener("DOMContentLoaded", loadTickets);
</script>

</body>
</html>
